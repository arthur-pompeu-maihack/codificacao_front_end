<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <table>
        <caption>Horários das aulas de semna</caption>
        <thead>
            <tr>
                <th scope="col">Dia da Semana</th>
                <th scope="col">unidade Curricular</th>
                <th scope="col">Horário</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Terça-Feira</td>
                <td>Codificação para Front-End</td>
                <td>14:00 ás 17:00</td>
            </tr>
        </tbody>
        <tfoot> <!--Rodapé da Tabela</tfoot>-->
        <tr>
            <td colspan="3"> Intervalo: 15:15 ás 15:30</td>
        </tr>
        
    </table>
    
</body>
</html>
